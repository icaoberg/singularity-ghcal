name: Release

on:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            NEXT="0.1"
          else
            NEXT=$(python3 -c "v=float('${LATEST}'); print(f'{v+0.1:.1f}')")
          fi
          echo "version=$NEXT" >> $GITHUB_OUTPUT

      - name: Update VERSION in Singularity definition
        run: |
          sed -i "s/^\(    VERSION \).*/\1${{ steps.version.outputs.version }}/" Singularity

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Singularity
          git commit -m "Release ${{ steps.version.outputs.version }} [skip ci]"
          git push

      - name: Set up Apptainer
        uses: eWaterCycle/setup-apptainer@v2

      - name: Build image
        run: sudo apptainer build singularity-ghcal.sif Singularity

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            singularity-ghcal.sif \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes
