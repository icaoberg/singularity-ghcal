name: Release

on:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            NEXT="v1.0.0"
          else
            BARE="${LATEST#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BARE"
            NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "version=$NEXT" >> $GITHUB_OUTPUT

      - name: Update VERSION in Singularity definition
        run: |
          VERSION_BARE="${{ steps.version.outputs.version }}"
          VERSION_BARE="${VERSION_BARE#v}"
          sed -i "s/^\(    VERSION \).*/\1${VERSION_BARE}/" Singularity

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Singularity
          git commit -m "Release ${{ steps.version.outputs.version }} [skip ci]"
          git push

      - name: Set up Apptainer
        uses: eWaterCycle/setup-apptainer@v2

      - name: Build image
        run: sudo apptainer build singularity-ghcal.sif Singularity

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            singularity-ghcal.sif \
            --title "${{ steps.version.outputs.version }}" \
            --generate-notes
